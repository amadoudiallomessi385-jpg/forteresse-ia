<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ma Forteresse IA</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; }
        .msg { margin: 10px; padding: 10px; border-radius: 8px; max-width: 80%; }
        .user { background: #333; align-self: flex-end; margin-left: auto; }
        .ai { background: #004d40; border: 1px solid #00bfa5; }
        .input-area { padding: 20px; background: #222; display: flex; }
        input { flex: 1; padding: 10px; background: #333; border: none; color: white; }
        button { padding: 10px 20px; background: #00bfa5; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div id="chat"></div>
    <div class="input-area">
        <input type="text" id="text" placeholder="Entrez vos ordres...">
        <button onclick="envoyer()">Envoyer</button>
    </div>

    <script>
        function add(msg, type) {
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            div.innerText = msg;
            document.getElementById('chat').appendChild(div);
            document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
        }

        async function envoyer() {
            const input = document.getElementById('text');
            const message = input.value;
            if(!message) return;

            add(message, 'user');
            input.value = "";

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });
                const data = await response.json();
                if (data.reply) { add(data.reply, 'ai'); }
                else { add("Le Gardien ne répond pas.", 'ai'); }
            } catch (e) {
                add("La liaison avec le Gardien a échoué.", 'ai');
            }
        }
    </script>
</body>
</html>
