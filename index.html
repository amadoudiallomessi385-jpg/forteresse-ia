<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forteresse IA</title>
    <style>
        body { background: #121212; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 12px 18px; border-radius: 15px; max-width: 85%; line-height: 1.4; word-wrap: break-word; }
        .user { background: #2c2c2c; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai { background: #004d40; border: 1px solid #00bfa5; align-self: flex-start; border-bottom-left-radius: 2px; }
        .input-area { padding: 15px; background: #1e1e1e; border-top: 1px solid #333; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; background: #252525; border: 1px solid #444; color: white; border-radius: 25px; outline: none; }
        button { background: #00bfa5; color: black; border: none; padding: 0 20px; border-radius: 25px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div id="chat"></div>
    <div class="input-area">
        <input type="text" id="text" placeholder="Entrez vos ordres, Seigneur..." onkeypress="if(event.key==='Enter') envoyer()">
        <button onclick="envoyer()">Envoyer</button>
    </div>

    <script>
        function add(msg, type) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            div.innerText = msg;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        async function envoyer() {
            const input = document.getElementById('text');
            const message = input.value;
            if(!message) return;

            add(message, 'user');
            input.value = "";

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });
                const data = await response.json();
                if (data.reply) { add(data.reply, 'ai'); }
                else { add("Le Gardien est silencieux.", 'ai'); }
            } catch (e) {
                add("La liaison avec le Gardien a échoué.", 'ai');
            }
        }
    </script>
</body>
</html>.
